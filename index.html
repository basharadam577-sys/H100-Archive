<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>H100 Archive — أرشيف ربكاوي</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">🌍 H100 <span>Archive</span></div>
  <div class="subtitle">أرشيف ربكاوي — وثّق، احفظ، وابحث</div>
</header>

<main>
  <section class="hero">
    <h1>أرشيفك الموثّق</h1>
    <p>سجّل المعلومات والصور والمصادر في مكان واحد.</p>
    <button onclick="document.getElementById('title').focus()">➕ إضافة توثيق</button>
  </section>

  <section class="card">
    <h2>إضافة توثيق جديد</h2>
    <form id="form">
      <input id="title" required placeholder="عنوان التوثيق">
      <textarea id="details" required placeholder="اكتب التفاصيل أو المعلومة هنا..."></textarea>
      <input id="source" type="url" placeholder="رابط المصدر (اختياري)">
      <input id="date" type="date">
      <input id="file" type="file" accept="image/*,.pdf,.txt,.doc,.docx">
      <button type="submit">💾 حفظ التوثيق</button>
    </form>
  </section>

  <section class="card">
    <div class="searchRow">
      <h2>التوثيقات المحفوظة</h2>
      <input id="search" placeholder="🔎 ابحث...">
    </div>
    <div id="list"></div>
  </section>
</main>

<footer>H100 Archive © 2026 — النسخة التجريبية</footer>
<script src="app.js"></script>
</body>
</html>
